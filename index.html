<!DOCTYPE html>
<html>
<body>

<img id="img" width="600">

<script>
fetch("https://raw.githubusercontent.com/ENGIESG6605/QRCODE/main/image.txt")
  .then(r => r.text())
  .then(file => {
      document.getElementById("img").src =
        "https://raw.githubusercontent.com/ENGIESG6605/QRCODE/main/" + file.trim();
  });
</script>

</body>
</html>
