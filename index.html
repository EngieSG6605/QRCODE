<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#img {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>
<body>

<img id="img" alt="Image plein écran">

<script>
fetch("./image.txt?t=" + Date.now())
  .then(r => r.text())
  .then(file => {
      document.getElementById("img").src =
          file.trim() + "?t=" + Date.now();
  });
</script>

</body>
</html>
``
