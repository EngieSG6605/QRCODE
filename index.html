<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Image</title>
</head>
<body>

    <img id="img" style="max-width:100%;">

    <script>
        fetch("./image.txt?t=" + Date.now())
        .then(r => r.text())
        .then(filename => {
            document.getElementById("img").src =
                "https://raw.githubusercontent.com/EngieSG6605/QRCODE/main/" +
                filename.trim();
        })
        .catch(err => {
            document.body.innerHTML = "Erreur : " + err.message;
        });
    </script>

</body>
</html>
